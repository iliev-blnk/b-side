<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>b-side</title>
    <meta name="description" content="One record pressed every night: a side of three jazz tunes and a cut-paper film made to them, all from the date. You can sit in with the band." />
    <meta property="og:title" content="b-side" />
    <meta property="og:description" content="One record pressed every night: a side of three jazz tunes and a cut-paper film made to them, all from the date. You can sit in with the band." />
    <meta property="og:image" content="https://iliev-blnk.github.io/b-side/og.jpg" />
    <meta property="og:url" content="https://iliev-blnk.github.io/b-side/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0e0d0c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230e0d0c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c8321f'/%3E%3Ccircle cx='16' cy='16' r='1.2' fill='%230e0d0c'/%3E%3C/svg%3E" />
    <style>
      :root {
        --ink: #0e0d0c;
        --bone: #e9e3d6;
        --dim: #9a9387;
        --line: #2b2825;
        --red: #c8321f;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html { background: var(--ink); }
      body { margin: 0; background: var(--ink); color: var(--bone); font-family: "Jost Variable", Jost, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      main { width: min(1120px, 100%); margin: 0 auto; padding: 40px 16px 80px; }
      header h1 { font-weight: 800; font-size: clamp(56px, 11vw, 120px); line-height: 0.8; letter-spacing: -0.02em; margin: 0; }
      header p { margin: 18px 0 0; max-width: 34em; color: var(--dim); font-size: 18px; line-height: 1.45; }

      .today { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 64px); align-items: center; margin: clamp(40px, 7vw, 88px) 0 clamp(56px, 8vw, 104px); }
      .today .sleeve { width: min(100%, 560px); }
      .today .meta h2 { font-size: clamp(30px, 4.4vw, 52px); line-height: 1; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
      .today .meta p { color: var(--dim); margin: 14px 0 0; font-size: 17px; line-height: 1.5; }
      .today .meta .band { color: var(--bone); }
      .play { margin-top: 28px; font: inherit; font-weight: 700; font-size: 18px; border: 0; background: var(--bone); color: var(--ink); padding: 14px 26px 14px 22px; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; }
      .play::before { content: ""; width: 0; height: 0; border-left: 12px solid currentColor; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
      .play:hover { background: #fff; }
      .missing { color: var(--dim); font-size: 18px; margin: 64px 0; }

      .sleeve { position: relative; display: block; aspect-ratio: 1; border: 0; padding: 0; background: none; cursor: pointer; width: 100%; }
      .sleeve canvas { position: relative; z-index: 1; width: 100%; height: 100%; display: block; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55); }
      .sleeve .disc { position: absolute; inset: 3% 3% 3% 3%; border-radius: 50%; background: repeating-radial-gradient(circle, #151413 0 2px, #1d1b19 2px 4px); transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1); transform: translateX(14%); }
      .sleeve .disc::after { content: ""; position: absolute; inset: 33%; border-radius: 50%; background: var(--label, var(--red)); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); }
      .sleeve:hover .disc, .sleeve:focus-visible .disc { transform: translateX(26%); }
      .sleeve:focus-visible { outline: 3px solid var(--bone); outline-offset: 6px; }

      .cat-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; margin: 0 0 28px; padding-top: 28px; border-top: 1px solid var(--line); }
      .cat-head h3 { font-size: 15px; font-weight: 600; color: var(--dim); margin: 0; letter-spacing: 0.02em; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
      .controls .search, .controls select { font: inherit; font-size: 15px; color: var(--bone); background: #1a1816; border: 1px solid var(--line); padding: 8px 12px; height: 38px; }
      .controls .search { width: 15em; }
      .controls .search:focus, .controls select:focus { outline: 2px solid var(--bone); outline-offset: 1px; }
      .chips { display: inline-flex; border: 1px solid var(--line); }
      .chip { font: inherit; font-size: 14px; color: var(--dim); background: none; border: 0; padding: 0 12px; height: 36px; cursor: pointer; }
      .chip + .chip { border-left: 1px solid var(--line); }
      .chip[aria-pressed="true"] { background: var(--bone); color: var(--ink); }
      .chip:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
      .none { color: var(--dim); }
      .month-nav { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
      .month-nav h4 { margin: 0; font-size: 20px; font-weight: 600; min-width: 9em; text-align: center; }
      .month-nav .step { font: inherit; font-size: 18px; width: 38px; height: 38px; background: none; color: var(--bone); border: 1px solid var(--line); cursor: pointer; }
      .month-nav .step:disabled { opacity: 0.3; cursor: default; }
      .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
      .cal .wd { font-size: 13px; color: var(--dim); }
      .cal .day { position: relative; aspect-ratio: 1; background: #151413; }
      .cal .day .date { position: absolute; z-index: 2; top: 4px; left: 6px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
      .cal .day .sleeve canvas { box-shadow: none; }
      .cal .day .disc { display: none; }
      .cal .day:has(.sleeve) .date { top: 0; left: 0; padding: 2px 6px; background: #0e0d0cd9; color: var(--bone); }
      .cal .day.empty { background: none; border: 1px dashed var(--line); }
      .cal .day.out .sleeve { opacity: 0.18; }
      .today .meta .more { display: flex; gap: 20px; align-items: center; margin-top: 18px; font-size: 15px; }
      .today .meta .more a, .today .meta .more button { color: var(--bone); font: inherit; font-size: 15px; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 36px 24px; }
      .grid figure { margin: 0; }
      .grid .disc { display: none; }
      .grid figcaption { margin-top: 12px; font-size: 14px; color: var(--dim); line-height: 1.35; }
      .grid figcaption b { display: block; font-weight: 600; }
      .grid figcaption a { color: var(--bone); text-decoration: none; }
      .grid figcaption a:hover { text-decoration: underline; }

      footer { margin-top: 96px; color: var(--dim); font-size: 14px; line-height: 1.6; }
      footer a { color: var(--bone); }

      .today .meta .tracks { list-style: none; padding: 0; margin: 18px 0 0; counter-reset: track; max-width: 30em; }
      .today .meta .tracks li { counter-increment: track; display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 17px; }
      .today .meta .tracks li::before { content: counter(track); color: var(--dim); width: 1em; }
      .today .meta .tracks li span { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
      .today .meta .sat { color: var(--bone); border-left: 2px solid var(--red); padding-left: 12px; }

      .player { position: fixed; inset: 0; background: #000; z-index: 10; display: none; flex-direction: column; }
      .player.on { display: flex; }
      .player .screen { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; }
      .player .film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; }
      .player .still { width: min(60vmin, 520px); height: auto; aspect-ratio: 1; }
      .player .close { position: absolute; top: 14px; right: 14px; z-index: 2; font: inherit; font-size: 15px; font-weight: 600; background: rgba(14, 13, 12, 0.7); color: var(--bone); border: 0; padding: 10px 16px; cursor: pointer; }
      .player .wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 16px; }

      .deck { padding: 14px 18px 16px; border-top: 1px solid var(--line); background: var(--ink); }
      .deck button { font: inherit; cursor: pointer; }
      .deck .top { display: flex; align-items: center; gap: 14px; }
      .deck .time { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 3em; text-align: right; }
      .timeline { position: relative; flex: 1; display: flex; gap: 3px; height: 32px; cursor: pointer; touch-action: none; user-select: none; }
      .timeline:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
      .timeline .act { flex-basis: 0; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #1a1816; font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; }
      .timeline .act .n { color: var(--bone); font-weight: 600; }
      .timeline .act .title { overflow: hidden; text-overflow: ellipsis; }
      .timeline .head { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--red); pointer-events: none; }
      .deck .row { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
      .deck .toggle { height: 56px; min-width: 88px; padding: 0 16px; background: none; color: var(--bone); border: 1px solid var(--line); font-weight: 600; font-size: 15px; }
      .deck .toggle:hover { border-color: var(--dim); }
      .pads { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
      .pad { height: 56px; border: 0; background: #1a1816; color: var(--dim); transition: background 0.3s ease-out, color 0.3s ease-out; touch-action: none; }
      .pad kbd { font: inherit; font-size: 13px; font-weight: 600; }
      .pad:hover { background: #221f1c; }
      .pad.on { background: var(--bone); color: var(--ink); transition: none; }
      .pad.miss { background: var(--line); transition: none; }
      .pad:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
      .knobs { display: flex; gap: 16px; }
      .knob { position: relative; display: grid; justify-items: center; gap: 5px; }
      .knob .dial { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #151413; }
      .knob .dial::after { content: ""; position: absolute; left: 50%; top: 4px; width: 2px; height: 15px; margin-left: -1px; background: var(--bone); transform-origin: 50% 17px; transform: rotate(calc(-135deg + var(--v, 0.5) * 270deg)); }
      .knob input { position: absolute; left: -6px; right: -6px; top: 0; height: 46px; margin: 0; opacity: 0; cursor: ew-resize; }
      .knob:focus-within .dial { outline: 2px solid var(--bone); outline-offset: 2px; }
      .knob .name { font-size: 12px; color: var(--dim); }
      .deck .take { display: flex; align-items: center; gap: 16px; margin-top: 12px; font-size: 14px; color: var(--dim); min-height: 20px; }
      .deck .take button { background: none; border: 0; padding: 0; color: var(--bone); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

      @media (max-width: 760px) {
        .today { grid-template-columns: 1fr; }
        .today .sleeve { width: 86%; }
        .deck { padding: 12px 16px 14px; }
        .deck .row { flex-wrap: wrap; gap: 12px; }
        .pads { order: -1; flex-basis: 100%; gap: 4px; }
        .pad { height: 60px; }
        .deck .toggle { height: 48px; }
        .knobs { margin-left: auto; }
        .timeline .act .title { display: none; }
        .controls { width: 100%; }
        .controls .search { width: 100%; }
        .cal { gap: 4px; }
        .cal .wd { font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>b-side</h1>
        <p>One record pressed every night. Each is a side of three jazz tunes and a cut-paper film made to them, all from the date. You can sit in with the band.</p>
      </header>
      <section id="today"></section>
      <section class="catalogue" id="shelf" hidden></section>
      <footer>
        Made in Chișinău by <a href="https://iliebeleniuc.pages.dev">Ilie Beleniuc</a>. Samples from the
        <a href="https://github.com/sgossner/VCSL">Versilian Community Sample Library</a> (CC0).
        <a href="https://github.com/iliev-blnk/b-side">Source</a>.
      </footer>
    </main>
    <div class="player" id="player" role="dialog" aria-label="Now playing">
      <button class="close" id="close">close</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
