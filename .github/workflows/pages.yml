name: Pages

# The record pages and the feed are built from the date and the releases, so the site is rebuilt
# every night: after the pressing, and on its own a little later in case the pressing failed.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Press]
    types: [completed]
  schedule:
    - cron: "20 21 * * *"
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/label.mjs site
        env:
          CHROMIUM: /usr/bin/google-chrome
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
